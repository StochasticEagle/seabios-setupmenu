name: Check GitHub Actions Versions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-actions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check action versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          checker='.github/workflows/check-actions.yml'

          mapfile -t records < <(
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
              ! -path "$checker" -print0 \
              | sort -z \
              | while IFS= read -r -d '' file; do
                  grep -hoE 'uses:[[:space:]]*[^[:space:]#]+' "$file" \
                    | sed -E "s#^#${file}|#; s#uses:[[:space:]]*##"
                done \
              | sort -u
          )

          {
            echo '# GitHub Actions version check'
            echo
            echo '| Workflow | Action | Current | Latest major | Status |'
            echo '|---|---|---:|---:|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          for record in "${records[@]}"; do
            file="${record%%|*}"
            reference="${record#*|}"

            case "$reference" in
              ./*|docker://*)
                continue
                ;;
            esac

            if [[ "$reference" != *@* ]]; then
              continue
            fi

            action_path="${reference%@*}"
            current="${reference##*@}"
            owner_repo="$(cut -d/ -f1,2 <<< "$action_path")"
            workflow="${file#.github/workflows/}"

            tags="$(gh api --paginate "/repos/${owner_repo}/tags?per_page=100" --jq '.[].name' 2>/dev/null || true)"

            latest_major="$(
              grep -E '^v[0-9]+$' <<< "$tags" \
                | sed 's/^v//' \
                | sort -n \
                | tail -n1 \
                | sed 's/^/v/'
            )"

            if [[ -z "$latest_major" ]]; then
              status='No major tag found'
              latest_major='—'
            elif [[ "$current" =~ ^v([0-9]+)(\.|$) ]]; then
              current_major="${BASH_REMATCH[1]}"
              latest_number="${latest_major#v}"

              if (( current_major < latest_number )); then
                status="OUTDATED → ${latest_major}"
              elif (( current_major == latest_number )); then
                status='Current major'
              else
                status='Current ref is newer than latest major tag'
              fi
            elif [[ "$current" =~ ^[0-9a-fA-F]{40}$ ]]; then
              status='SHA pinned; review latest major manually'
            else
              status='Non-version ref; review manually'
            fi

            echo "| \`${workflow}\` | \`${action_path}\` | \`${current}\` | \`${latest_major}\` | ${status} |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow is report-only, excludes itself, and never changes workflow files.' >> "$GITHUB_STEP_SUMMARY"
